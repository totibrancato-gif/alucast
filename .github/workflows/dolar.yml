name: Actualizar dólar BROU
on:
  schedule:
    - cron: "52 13 * * 1-5"   # 10:52 Uruguay, lunes a viernes
    - cron: "52 17 * * 1-5"   # 14:52 Uruguay, por si el banco cambió el valor
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  dolar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/dolar.py
      - name: Guardar si cambió
        run: |
          if ! git diff --quiet dolar.json; then
            git config user.name "alucast-bot"
            git config user.email "alucast-bot@users.noreply.github.com"
            git add dolar.json
            git commit -m "Dólar BROU $(date -u +%F)"
            git push
          fi
